name: ✨ Feature request or improvement
description: Suggest a new capability, or an improvement to an existing one
title: '[Feature]: '
type: Feature
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Requesting a **connector we do not support yet**? Post it in
        [Discussions → Ideas](https://github.com/OWOX/owox-data-marts/discussions/categories/ideas)
        instead, so others can upvote it.

        ⚠️ This issue will be public — do not paste credentials, tokens, or API keys.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preliminary checks
      options:
        - label: I searched [existing
            issues](https://github.com/OWOX/owox-data-marts/issues?q=is%3Aissue) and this has not
            been requested yet.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      description: Which part of OWOX Data Marts would this change?
      options:
        - Sources / Connectors
        - Connector Builder / Custom Connectors
        - Data Marts
        - Storages
        - Destinations
        - Reports
        - Triggers / Scheduling
        - MCP Server
        - Plugins
        - API / API Keys / owox-ctl
        - Members, Roles & Permissions / Authentication
        - Project Settings / Notifications
        - UI / UX
        - Installation / Deployment / CLI
        - Documentation
        - Other / Not sure
    validations:
      required: true

  # Keep the source options in sync with packages/connectors/src/Sources/*/manifest.json (title).
  - type: dropdown
    id: integration
    attributes:
      label: Connector, storage, or destination involved
      description: Select every one involved. Leave empty if this is not specific to an integration.
      multiple: true
      options:
        - 'Source: Bank of Canada'
        - 'Source: Criteo Ads'
        - 'Source: Facebook Ads'
        - 'Source: GitHub'
        - 'Source: Google Ads'
        - 'Source: Google Sheets'
        - 'Source: LinkedIn Ads'
        - 'Source: LinkedIn Pages'
        - 'Source: Microsoft Ads'
        - 'Source: Open Exchange Rates'
        - 'Source: Open Holidays'
        - 'Source: Reddit Ads'
        - 'Source: Shopify'
        - 'Source: TikTok Ads'
        - 'Source: X Ads'
        - 'Source: custom connector (Connector Builder)'
        - 'Storage: Google BigQuery'
        - 'Storage: AWS Athena'
        - 'Storage: AWS Redshift'
        - 'Storage: Snowflake'
        - 'Storage: Databricks'
        - 'Destination: Google Sheets'
        - 'Destination: Microsoft Excel'
        - 'Destination: Data Studio'
        - 'Destination: Email'
        - 'Destination: Slack'
        - 'Destination: Microsoft Teams'
        - 'Destination: Google Chat'
        - Other / not listed
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description:
        Describe the use case, who it affects, and how you work around it today. Focus on the
        problem rather than the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should OWOX Data Marts do instead? Describe the behavior you expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you evaluated.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to submit a pull request to address this issue?
      description:
        Informational only. A feature request is welcome either way, and GitHub cannot hold you to
        this answer.
      options:
        - Yes — I plan to work on this and open a pull request
        - Maybe — I could try with guidance from a maintainer
        - No — I am requesting this for the maintainers to build
    validations:
      required: true
