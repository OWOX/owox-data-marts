name: Snapshot
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for changesets to work properly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo_lower
        run: |
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.19.0
          npm --version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund --loglevel error

      - name: Update wildcard version for internal packages
        run: node tools/update-package-versions-for-publishing.mjs

      - name: Inject PostHog telemetry key
        run: node packages/internal-helpers/scripts/inject-posthog-key.mjs
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Build publishable packages
        # plugin-sdk is published for plugin authors and nothing in this repo imports it,
        # so no other build reaches it -- without this its tarball would carry no dist.
        run: npm run build --workspace owox --workspace @owox/ctl --workspace @owox/plugin-sdk

      # TODO: re-enable after fixing shrinkwrap generation for snapshot publishes
      # - name: Generate npm-shrinkwrap.json for owox
      #   run: node tools/generate-shrinkwrap.mjs

      - name: Publish to "latest"
        run: |
          npx changeset publish

      - name: Extract "latest" version
        id: extract_latest_version
        run: |
          VERSION=$(npm pkg get version -w apps/owox | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Check if npm package with this "latest" version exists
        env:
          # npm needs well past the old five-minute window to serve a freshly
          # published @owox/backend; see tools/wait-for-npm-version.mjs.
          WAIT_TIMEOUT_SECONDS: '1500'
        run: |
          node tools/wait-for-npm-version.mjs "${{ steps.extract_latest_version.outputs.version }}" \
            @owox/web @owox/backend @owox/internal-helpers @owox/idp-protocol \
            @owox/idp-better-auth @owox/idp-owox-better-auth @owox/api-client \
            @owox/plugin-sdk @owox/ctl owox

      - name: Check if container image with this "latest" version exists
        id: latest_image_exists
        run: |
          if docker manifest inspect ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_latest_version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Build and push "latest" container image
        if: steps.latest_image_exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ steps.extract_latest_version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_latest_version.outputs.version }}
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:latest

      - name: Create dummy changeset
        run: |
          cat <<EOF > .changeset/snapshot-release.md
          ---
          "owox": minor
          ---
          Snapshot release
          EOF

      - name: Publish to "next"
        run: |
          npx changeset version --snapshot next
          npx changeset publish --no-git-tag --tag next

      - name: Extract "next" version
        id: extract_next_version
        run: |
          VERSION=$(npm pkg get version -w apps/owox | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+-next-[0-9]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Check if npm package with this "next" version exists
        env:
          # npm needs well past the old five-minute window to serve a freshly
          # published @owox/backend; see tools/wait-for-npm-version.mjs.
          WAIT_TIMEOUT_SECONDS: '1500'
        run: |
          node tools/wait-for-npm-version.mjs "${{ steps.extract_next_version.outputs.version }}" \
            @owox/web @owox/backend @owox/internal-helpers @owox/idp-protocol \
            @owox/idp-better-auth @owox/idp-owox-better-auth @owox/api-client \
            @owox/plugin-sdk @owox/ctl owox

      - name: Build and push "next" container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ steps.extract_next_version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_next_version.outputs.version }}
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:next
