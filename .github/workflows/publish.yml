name: Snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_latest_image:
        description: 'Rebuild the "latest" image from this ref even though nothing was published'
        type: boolean
        default: false

# Two runs packing the same version from different trees would race to push the
# same tag. Never cancel: a half-finished publish is worse than a queued one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for changesets to work properly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo_lower
        run: |
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.19.0
          npm --version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund --loglevel error

      - name: Update wildcard version for internal packages
        run: node tools/update-package-versions-for-publishing.mjs

      - name: Inject PostHog telemetry key
        run: node packages/internal-helpers/scripts/inject-posthog-key.mjs
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Build publishable packages
        # plugin-sdk is published for plugin authors and nothing in this repo imports it,
        # so no other build reaches it -- without this its tarball would carry no dist.
        run: npm run build --workspace owox --workspace @owox/ctl --workspace @owox/plugin-sdk

      # TODO: re-enable after fixing shrinkwrap generation for snapshot publishes
      # - name: Generate npm-shrinkwrap.json for owox
      #   run: node tools/generate-shrinkwrap.mjs

      - name: Publish to "latest"
        id: publish_latest
        run: |
          set -o pipefail
          npx changeset publish | tee /tmp/changeset-publish.log
          if grep -q "New tag:" /tmp/changeset-publish.log; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Extract "latest" version
        id: extract_latest_version
        run: |
          VERSION=$(npm pkg get version -w apps/owox | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Check if container image with this "latest" version exists
        id: latest_image_exists
        run: |
          if docker manifest inspect ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_latest_version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Pack workspaces for the "latest" container image
        if: |
          steps.latest_image_exists.outputs.exists == 'false'
          && (steps.publish_latest.outputs.published == 'true'
              || inputs.rebuild_latest_image)
        run: node tools/pack-owox-image-packages.mjs

      - name: Build and push "latest" container image
        if: |
          steps.latest_image_exists.outputs.exists == 'false'
          && (steps.publish_latest.outputs.published == 'true'
              || inputs.rebuild_latest_image)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ steps.extract_latest_version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_latest_version.outputs.version }}
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:latest

      - name: Create dummy changeset
        run: |
          cat <<EOF > .changeset/snapshot-release.md
          ---
          "owox": minor
          ---
          Snapshot release
          EOF

      # The snapshot is versioned but deliberately not published to npm: the image
      # is built from the packed tarballs, and publishing every merge is what grew
      # @owox/backend's packument to the point where npm needs a quarter of an hour
      # to serve a new version. Releases still go to npm above.
      - name: Version the "next" snapshot
        run: npx changeset version --snapshot next

      - name: Extract "next" version
        id: extract_next_version
        run: |
          VERSION=$(npm pkg get version -w apps/owox | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+-next-[0-9]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Pack workspaces for the "next" container image
        run: node tools/pack-owox-image-packages.mjs

      - name: Build and push "next" container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ steps.extract_next_version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:${{ steps.extract_next_version.outputs.version }}
            ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:next
