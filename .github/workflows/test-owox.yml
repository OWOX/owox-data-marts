name: Test OWOX

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/ctl/**'
      - 'apps/owox/**'
      - 'apps/web/**'
      - 'packages/**'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test job
  test:
    name: ${{ matrix.test.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.test.timeout }}

    strategy:
      # If one check fails, the others will continue to run
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        test:
          - name: 'Overall test @owox/backend'
            command: 'npm run test -w @owox/backend'
            timeout: 10
          - name: 'Overall test @owox/web'
            command: 'npm run test -w @owox/web'
            timeout: 10
          - name: 'Overall test owox'
            command: 'npm run test -w owox'
            timeout: 10
          - name: 'Overall test @owox/idp-better-auth'
            command: 'npm run test -w @owox/idp-better-auth'
            timeout: 10
          - name: 'Overall test @owox/idp-owox-better-auth'
            command: 'npm run test -w @owox/idp-owox-better-auth'
            timeout: 10
          - name: 'Overall test @owox/api-client'
            command: 'npm run test -w @owox/api-client'
            timeout: 10
          - name: 'Overall test @owox/ctl'
            command: 'npm run test -w @owox/ctl'
            timeout: 10
          # Unit + declarative-engine suite for @owox/connectors (vitest plus an
          # explicit `node --test` file list). Needs no credentials and no network:
          # the live ad-connector fixtures live in the separate `test:fixtures`
          # script, which is deliberately NOT gated here because it calls real APIs.
          - name: 'Overall test @owox/connectors'
            command: 'npm run test -w @owox/connectors'
            timeout: 10
          # Type-level tests for the @owox/connectors shipped declarations
          # (tsc --noEmit; resolves the static .d.ts, so no connectors build is
          # needed). Distinct from the suite above, which never type-checks the
          # published .d.ts.
          - name: 'Type tests @owox/connectors'
            command: 'npm run test:types -w @owox/connectors'
            timeout: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund --loglevel error

      - name: Build better-sqlite3 native binding
        if: matrix.test.name == 'Overall test @owox/backend'
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Build publishable CLI packages
        run: npm run build --workspace owox --workspace @owox/ctl

      - name: Run ${{ matrix.test.name }}
        run: ${{ matrix.test.command }}
        env:
          NODE_ENV: test
