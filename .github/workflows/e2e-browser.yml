name: E2E Browser Tests

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/web/**'
      - 'packages/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: Browser E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Playwright runs one worker (the specs share a SQLite database), so wall-clock grows with
    # the suite. Each shard is a separate runner with its own database, as in e2e-api.yml.
    # Playwright splits by spec file, and datamart-calculated-field-chips alone runs ~90 s:
    # five shards keep it nearly alone, which four did not.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel error

      # The suite needs only the backend (with its own build:dep packages) and the web bundle.
      - name: Build backend and web
        run: npm run build -w @owox/backend -w @owox/web

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Create temp directory for SQLite
        run: mkdir -p tmp

      - name: Run Browser E2E tests
        run: cd apps/web && npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true
          NODE_ENV: test
          SQLITE_DB_PATH: ${{ github.workspace }}/tmp/tests.db
          SERVER_TIMEOUT_MS: '180000'
          KEEP_ALIVE_TIMEOUT_MS: '180000'
          HEADERS_TIMEOUT_MS: '185000'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
